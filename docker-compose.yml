services:
  ldap-internal:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: "nycu"
      LDAP_DOMAIN: "nycu"
      LDAP_BASE_DN: "dc=nycu"
      LDAP_ADMIN_PASSWORD: "adminpass"
    ports:
      - "3891:389"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -D 'cn=admin,dc=nycu' -w 'adminpass' -b 'dc=nycu' -s base '(objectClass=*)' dn >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./testdata/seed-internal.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/seed.ldif
    command: --copy-service --loglevel debug

  ldap-external:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: "nycu"
      LDAP_DOMAIN: "nycu"
      LDAP_BASE_DN: "dc=nycu"
      LDAP_ADMIN_PASSWORD: "adminpass"
    ports:
      - "3892:389"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -D 'cn=admin,dc=nycu' -w 'adminpass' -b 'dc=nycu' -s base '(objectClass=*)' dn >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./testdata/seed-external.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/seed.ldif
    command: --copy-service --loglevel debug

  service:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env.docker
    depends_on:
      ldap-internal:
        condition: service_healthy
      ldap-external:
        condition: service_healthy
    restart: on-failure
