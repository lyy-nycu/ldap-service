name: Debug password-hook AGW backend connectivity

# Temporary diagnostic workflow used to troubleshoot the staging Application
# Gateway backend health "Unhealthy (404)" status for the password-hook-service
# private path. Runs on the same self-hosted runner used by the AGW handoff
# workflow so it shares network reachability to the workload VNet. Safe to
# delete once the underlying issue is resolved.

on:
  workflow_dispatch: {}

jobs:
  debug:
    name: Curl/openssl test against password-hook internal FQDN
    runs-on:
      - self-hosted
      - linux
      - x64
      - azure-trusted
    env:
      TARGET_FQDN: ca-pwdhook-stg-mvxfna.internal.purplepond-efe764ce.japaneast.azurecontainerapps.io
      AGW_FRONTEND_IP: 10.0.8.62
      AGW_HOSTNAME: api.test.nycu.edu.tw
    steps:
      - name: DNS resolution
        run: |
          echo "=== getent hosts ==="
          getent hosts "$TARGET_FQDN" || echo "getent failed"
          echo "=== nslookup ==="
          nslookup "$TARGET_FQDN" || echo "nslookup failed"

      - name: TCP reachability to ACA static IP
        run: |
          timeout 5 bash -c "cat < /dev/null > /dev/tcp/$TARGET_FQDN/443" \
            && echo "TCP 443 to backend FQDN: OPEN" \
            || echo "TCP 443 to backend FQDN: FAILED/TIMEOUT"

      - name: TCP reachability to AGW private frontend
        run: |
          timeout 5 bash -c "cat < /dev/null > /dev/tcp/$AGW_FRONTEND_IP/443" \
            && echo "TCP 443 to AGW frontend: OPEN" \
            || echo "TCP 443 to AGW frontend: FAILED/TIMEOUT"

      - name: openssl s_client against backend FQDN directly (bypass AGW)
        run: |
          echo | timeout 10 openssl s_client -connect "$TARGET_FQDN:443" -servername "$TARGET_FQDN" 2>&1 \
            | sed -n '1,60p' || echo "openssl s_client failed"

      - name: curl backend FQDN directly (bypass AGW) - verbose
        run: |
          curl -vk --max-time 10 "https://$TARGET_FQDN/healthz" 2>&1 || echo "curl (direct backend) failed"

      - name: curl through AGW private frontend with Host header
        run: |
          curl -vk --max-time 10 --resolve "$AGW_HOSTNAME:443:$AGW_FRONTEND_IP" "https://$AGW_HOSTNAME/healthz" 2>&1 \
            || echo "curl (through AGW) failed"

      - name: curl backend FQDN with explicit Host header variants
        run: |
          echo "--- lower-case host header, no SNI override ---"
          curl -vk --max-time 10 -H "Host: $TARGET_FQDN" "https://$TARGET_FQDN/healthz" 2>&1 || true
