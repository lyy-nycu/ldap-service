name: Password Hook AGW Staging Handoff

# Adds an isolated private frontend/listener/backend/probe/rule/WAF path for
# the password-hook-service on the shared staging Application Gateway
# (agw-stg-jpe-001). This workflow only creates NEW, uniquely-named objects;
# it never modifies any existing listener, rule, backend pool, probe, or the
# gateway-level WAF policy used by LDAP or any other workload. See
# password-hook-service's deploy/terraform/application-gateway-handoff.md
# for the full reviewed contract this workflow implements.
#
# This must be triggered manually (workflow_dispatch) after the
# password-hook-service owner confirms Pass 1 of its Terraform deployment
# is complete and the backend FQDN below is live.

"on":
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: Type "apply" to actually create the AGW objects. Any other value only prints the before-inventory.
        required: true
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: password-hook-agw-staging
  cancel-in-progress: false

jobs:
  handoff:
    name: Add password-hook private path to staging AGW
    runs-on:
      - self-hosted
      - linux
      - x64
      - azure-trusted
    environment: staging
    env:
      AGW_RESOURCE_GROUP: ${{ vars.AGW_RESOURCE_GROUP_STAGING }}
      AGW_NAME: ${{ vars.AGW_NAME_STAGING }}
      AGW_SSL_CERT_NAME: ${{ vars.AGW_SSL_CERT_NAME_STAGING }}
      AGW_VNET: ${{ vars.PASSWORD_HOOK_AGW_VNET_STAGING }}
      AGW_SUBNET: ${{ vars.PASSWORD_HOOK_AGW_SUBNET_STAGING }}
      PRIVATE_FRONTEND_IP: ${{ vars.PASSWORD_HOOK_PRIVATE_FRONTEND_IP_STAGING }}
      HOSTNAME: ${{ vars.PASSWORD_HOOK_HOSTNAME_STAGING }}
      RULE_PRIORITY: ${{ vars.PASSWORD_HOOK_RULE_PRIORITY_STAGING }}
      BACKEND_FQDN: ${{ vars.PASSWORD_HOOK_BACKEND_FQDN_STAGING }}
      PORTAL_CIDR: ${{ vars.PASSWORD_HOOK_PORTAL_CIDR_STAGING }}
      # Fixed, isolated object names. Never reuse or rename an existing
      # gateway object; these must not collide with any name already on
      # agw-stg-jpe-001.
      FRONTEND_IP_NAME: feip-password-hook-stg-private
      FRONTEND_PORT_NAME: port_443
      LISTENER_NAME: listener-password-hook-stg-private-https
      BACKEND_POOL_NAME: pool-password-hook-stg
      HTTP_SETTINGS_NAME: set-password-hook-stg-https
      PROBE_NAME: probe-password-hook-stg-healthz
      RULE_NAME: rule-password-hook-stg-private
      WAF_POLICY_NAME: waf-policy-password-hook-stg
      WAF_CUSTOM_RULE_NAME: BlockNonPortalSources
    steps:
      - name: Validate required variables
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AGW_RESOURCE_GROUP
            AGW_NAME
            AGW_SSL_CERT_NAME
            AGW_VNET
            AGW_SUBNET
            PRIVATE_FRONTEND_IP
            HOSTNAME
            RULE_PRIORITY
            BACKEND_FQDN
            PORTAL_CIDR
          )
          for k in "${required[@]}"; do
            if [[ -z "${!k:-}" ]]; then
              echo "missing required variable: $k" >&2
              exit 1
            fi
          done

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Capture before-inventory
        shell: bash
        run: |
          set -euo pipefail
          echo "## Application Gateway before-inventory ($AGW_NAME)"
          echo "### Listeners"
          az network application-gateway http-listener list \
            --gateway-name "$AGW_NAME" --resource-group "$AGW_RESOURCE_GROUP" \
            --query "[].name" -o tsv
          echo "### Routing rules (name, priority)"
          az network application-gateway rule list \
            --gateway-name "$AGW_NAME" --resource-group "$AGW_RESOURCE_GROUP" \
            --query "[].{name:name,priority:priority}" -o tsv
          echo "### Frontend IP configurations"
          az network application-gateway frontend-ip list \
            --gateway-name "$AGW_NAME" --resource-group "$AGW_RESOURCE_GROUP" \
            --query "[].name" -o tsv
          echo "### Backend address pools"
          az network application-gateway address-pool list \
            --gateway-name "$AGW_NAME" --resource-group "$AGW_RESOURCE_GROUP" \
            --query "[].name" -o tsv
          echo "### Gateway provisioning state"
          az network application-gateway show \
            --name "$AGW_NAME" --resource-group "$AGW_RESOURCE_GROUP" \
            --query "provisioningState" -o tsv
          echo "### Synthetic health check for an unrelated existing public route (LDAP)"
          curl -s -o /dev/null -w "LDAP public listener HTTP status: %{http_code}\n" \
            "https://api.test.nycu.edu.tw/" --max-time 10 || true

      - name: Stop before applying unless explicitly confirmed
        if: ${{ inputs.confirm_apply != 'apply' }}
        shell: bash
        run: |
          echo "confirm_apply was not set to 'apply'; before-inventory only, no changes made." >&2
          exit 1

      - name: Create isolated WAF policy (Prevention, OWASP 3.2 + BotManager 0.1)
        shell: bash
        run: |
          set -euo pipefail
          az network application-gateway waf-policy create \
            --name "$WAF_POLICY_NAME" \
            --resource-group "$AGW_RESOURCE_GROUP" \
            --type OWASP \
            --version 3.2 \
            --only-show-errors -o none

          az network application-gateway waf-policy managed-rule rule-set add \
            --policy-name "$WAF_POLICY_NAME" \
            --resource-group "$AGW_RESOURCE_GROUP" \
            --type Microsoft_BotManagerRuleSet \
            --version 0.1 \
            --only-show-errors -o none

          az network application-gateway waf-policy policy-setting update \
            --policy-name "$WAF_POLICY_NAME" \
            --resource-group "$AGW_RESOURCE_GROUP" \
            --mode Prevention \
            --state Enabled \
            --only-show-errors -o none

          # Priority-10 negated RemoteAddr IPMatch Block rule: block every
          # source EXCEPT the approved portal CIDR. This never uses an Allow
          # action, so OWASP/BotManager managed inspection still runs for
          # the approved source. The match condition must be supplied
          # inline at creation -- Azure rejects a custom rule created
          # without one (ApplicationGatewayFirewallCustomRuleNoMatch
          # ConditionNotSupported). The CLI's --match-conditions shorthand
          # syntax cannot express the nested variables[].variableName
          # shape reliably, so this uses a generated JSON file instead
          # (verified directly against the real staging gateway).
          cat > "${RUNNER_TEMP}/waf-match-conditions.json" << JSON
          [
            {
              "variables": [{"variableName": "RemoteAddr"}],
              "operator": "IPMatch",
              "values": ["${PORTAL_CIDR}"],
              "negate": true
            }
          ]
          JSON
          az network application-gateway waf-policy custom-rule create \
            --policy-name "$WAF_POLICY_NAME" \
            --resource-group "$AGW_RESOURCE_GROUP" \
            --name "$WAF_CUSTOM_RULE_NAME" \
            --priority 10 \
            --rule-type MatchRule \
            --action Block \
            --state Enabled \
            --match-conditions "@${RUNNER_TEMP}/waf-match-conditions.json" \
            --only-show-errors -o none

      - name: Create private frontend IP configuration
        shell: bash
        run: |
          set -euo pipefail
          az network application-gateway frontend-ip create \
            --gateway-name "$AGW_NAME" \
            --resource-group "$AGW_RESOURCE_GROUP" \
            --name "$FRONTEND_IP_NAME" \
            --private-ip-address "$PRIVATE_FRONTEND_IP" \
            --vnet-name "$AGW_VNET" \
            --subnet "$AGW_SUBNET" \
            --only-show-errors -o none

      - name: Create backend pool for the ACA password-hook Container App
        shell: bash
        run: |
          set -euo pipefail
          az network application-gateway address-pool create \
            --gateway-name "$AGW_NAME" \
            --resource-group "$AGW_RESOURCE_GROUP" \
            --name "$BACKEND_POOL_NAME" \
            --servers "$BACKEND_FQDN" \
            --only-show-errors -o none

      - name: Create /healthz probe
        shell: bash
        run: |
          set -euo pipefail
          az network application-gateway probe create \
            --gateway-name "$AGW_NAME" \
            --resource-group "$AGW_RESOURCE_GROUP" \
            --name "$PROBE_NAME" \
            --protocol Https \
            --host "$BACKEND_FQDN" \
            --path /healthz \
            --interval 30 \
            --timeout 30 \
            --threshold 3 \
            --only-show-errors -o none

      - name: Create HTTPS backend settings (never downgrade to HTTP)
        shell: bash
        run: |
          set -euo pipefail
          az network application-gateway http-settings create \
            --gateway-name "$AGW_NAME" \
            --resource-group "$AGW_RESOURCE_GROUP" \
            --name "$HTTP_SETTINGS_NAME" \
            --port 443 \
            --protocol Https \
            --host-name "$BACKEND_FQDN" \
            --probe "$PROBE_NAME" \
            --only-show-errors -o none

      - name: Create private HTTPS listener with listener-specific WAF policy
        shell: bash
        run: |
          set -euo pipefail
          az network application-gateway http-listener create \
            --gateway-name "$AGW_NAME" \
            --resource-group "$AGW_RESOURCE_GROUP" \
            --name "$LISTENER_NAME" \
            --frontend-ip "$FRONTEND_IP_NAME" \
            --frontend-port "$FRONTEND_PORT_NAME" \
            --ssl-cert "$AGW_SSL_CERT_NAME" \
            --host-name "$HOSTNAME" \
            --waf-policy "$WAF_POLICY_NAME" \
            --only-show-errors -o none

      - name: Create routing rule at the approved priority
        shell: bash
        run: |
          set -euo pipefail
          az network application-gateway rule create \
            --gateway-name "$AGW_NAME" \
            --resource-group "$AGW_RESOURCE_GROUP" \
            --name "$RULE_NAME" \
            --rule-type Basic \
            --priority "$RULE_PRIORITY" \
            --http-listener "$LISTENER_NAME" \
            --address-pool "$BACKEND_POOL_NAME" \
            --http-settings "$HTTP_SETTINGS_NAME" \
            --only-show-errors -o none

      - name: Verify after-inventory and unrelated route regression
        shell: bash
        run: |
          set -euo pipefail
          echo "## Application Gateway after-inventory ($AGW_NAME)"
          echo "### New listener bound to expected frontend/port/cert/WAF policy"
          az network application-gateway http-listener show \
            --gateway-name "$AGW_NAME" --resource-group "$AGW_RESOURCE_GROUP" \
            --name "$LISTENER_NAME" \
            --query "{frontendIpConfiguration:frontendIpConfiguration.id, sslCertificate:sslCertificate.id, firewallPolicy:firewallPolicy.id}" \
            -o json
          echo "### New rule priority"
          az network application-gateway rule show \
            --gateway-name "$AGW_NAME" --resource-group "$AGW_RESOURCE_GROUP" \
            --name "$RULE_NAME" --query "priority" -o tsv
          echo "### Backend health for the new pool (expect Unhealthy until password-hook Pass 2 deploys the Container App)"
          az network application-gateway show-backend-health \
            --name "$AGW_NAME" --resource-group "$AGW_RESOURCE_GROUP" \
            --query "backendAddressPools[?backendAddressPool.id contains '$BACKEND_POOL_NAME'].backendHttpSettingsCollection[].servers[].health" \
            -o tsv || true
          echo "### Gateway provisioning state after change"
          az network application-gateway show \
            --name "$AGW_NAME" --resource-group "$AGW_RESOURCE_GROUP" \
            --query "provisioningState" -o tsv
          echo "### Synthetic regression check for the unrelated existing public route (LDAP)"
          curl -s -o /dev/null -w "LDAP public listener HTTP status: %{http_code}\n" \
            "https://api.test.nycu.edu.tw/" --max-time 10 || true
          echo "### Existing listener/rule count unchanged (compare against before-inventory step output)"
          az network application-gateway http-listener list \
            --gateway-name "$AGW_NAME" --resource-group "$AGW_RESOURCE_GROUP" \
            --query "length(@)" -o tsv
          az network application-gateway rule list \
            --gateway-name "$AGW_NAME" --resource-group "$AGW_RESOURCE_GROUP" \
            --query "length(@)" -o tsv

# Rollback: remove only the isolated objects created above, in reverse
# order (rule, listener, http-settings, probe, address-pool, frontend-ip,
# waf-policy). Never restore the entire gateway from a snapshot; that
# would revert unrelated LDAP/public objects this workflow never touched.
#   az network application-gateway rule delete --gateway-name agw-stg-jpe-001 --resource-group rg-spoke-paas --name rule-password-hook-stg-private
#   az network application-gateway http-listener delete --gateway-name agw-stg-jpe-001 --resource-group rg-spoke-paas --name listener-password-hook-stg-private-https
#   az network application-gateway http-settings delete --gateway-name agw-stg-jpe-001 --resource-group rg-spoke-paas --name set-password-hook-stg-https
#   az network application-gateway probe delete --gateway-name agw-stg-jpe-001 --resource-group rg-spoke-paas --name probe-password-hook-stg-healthz
#   az network application-gateway address-pool delete --gateway-name agw-stg-jpe-001 --resource-group rg-spoke-paas --name pool-password-hook-stg
#   az network application-gateway frontend-ip delete --gateway-name agw-stg-jpe-001 --resource-group rg-spoke-paas --name feip-password-hook-stg-private
#   az network application-gateway waf-policy delete --name waf-policy-password-hook-stg --resource-group rg-spoke-paas
