name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        type: choice
        options:
          - staging
          - prod

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image: ${{ steps.acr.outputs.image }}
      login_server: ${{ steps.acr.outputs.login_server }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          image_tag="git-${GITHUB_SHA::7}"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve ACR login server
        id: acr
        shell: bash
        run: |
          set -euo pipefail
          login_server="$(az acr show --name "${{ vars.ACR_NAME }}" --query loginServer --output tsv)"
          image="${login_server}/ldap-service:${{ steps.meta.outputs.image_tag }}"
          echo "login_server=${login_server}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push image
        run: docker buildx build --push -t "${{ steps.acr.outputs.image }}" .

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        run: |
          az containerapp update \
            --name "${{ vars.ACA_APP_NAME_STAGING }}" \
            --resource-group "${{ vars.ACA_RESOURCE_GROUP_STAGING }}" \
            --image "${{ needs.build.outputs.image }}"

      - name: Wait for ready revision
        shell: bash
        run: |
          set -euo pipefail
          app_name="${{ vars.ACA_APP_NAME_STAGING }}"
          resource_group="${{ vars.ACA_RESOURCE_GROUP_STAGING }}"
          timeout_seconds=180
          interval_seconds=5

          target_revision="$(az containerapp show \
            --name "$app_name" \
            --resource-group "$resource_group" \
            --query properties.latestRevisionName \
            --output tsv)"
          deadline=$((SECONDS + timeout_seconds))

          while (( SECONDS < deadline )); do
            latest_ready_revision="$(az containerapp show \
              --name "$app_name" \
              --resource-group "$resource_group" \
              --query properties.latestReadyRevisionName \
              --output tsv)"
            running_status="$(az containerapp show \
              --name "$app_name" \
              --resource-group "$resource_group" \
              --query properties.runningStatus \
              --output tsv)"

            if [[ "$latest_ready_revision" == "$target_revision" && "$running_status" == "Running" ]]; then
              echo "container app revision is ready: $target_revision"
              exit 0
            fi

            echo "waiting for revision readiness: target=$target_revision ready=$latest_ready_revision status=$running_status"
            sleep "$interval_seconds"
          done

          echo "container app revision did not become ready in time: $target_revision" >&2
          exit 1

      - name: Login to ACR
        if: ${{ github.event_name == 'push' }}
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Update staging-latest tag
        if: ${{ github.event_name == 'push' }}
        run: |
          docker pull "${{ needs.build.outputs.image }}"
          docker tag "${{ needs.build.outputs.image }}" "${{ needs.build.outputs.login_server }}/ldap-service:staging-latest"
          docker push "${{ needs.build.outputs.login_server }}/ldap-service:staging-latest"

  deploy-prod:
    name: Deploy Prod
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy-staging
    if: ${{ always() && ((github.event_name == 'push' && needs.build.result == 'success' && needs.deploy-staging.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod' && needs.build.result == 'success')) }}
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        run: |
          az containerapp update \
            --name "${{ vars.ACA_APP_NAME_PROD }}" \
            --resource-group "${{ vars.ACA_RESOURCE_GROUP_PROD }}" \
            --image "${{ needs.build.outputs.image }}"

      - name: Wait for ready revision
        shell: bash
        run: |
          set -euo pipefail
          app_name="${{ vars.ACA_APP_NAME_PROD }}"
          resource_group="${{ vars.ACA_RESOURCE_GROUP_PROD }}"
          timeout_seconds=180
          interval_seconds=5

          target_revision="$(az containerapp show \
            --name "$app_name" \
            --resource-group "$resource_group" \
            --query properties.latestRevisionName \
            --output tsv)"
          deadline=$((SECONDS + timeout_seconds))

          while (( SECONDS < deadline )); do
            latest_ready_revision="$(az containerapp show \
              --name "$app_name" \
              --resource-group "$resource_group" \
              --query properties.latestReadyRevisionName \
              --output tsv)"
            running_status="$(az containerapp show \
              --name "$app_name" \
              --resource-group "$resource_group" \
              --query properties.runningStatus \
              --output tsv)"

            if [[ "$latest_ready_revision" == "$target_revision" && "$running_status" == "Running" ]]; then
              echo "container app revision is ready: $target_revision"
              exit 0
            fi

            echo "waiting for revision readiness: target=$target_revision ready=$latest_ready_revision status=$running_status"
            sleep "$interval_seconds"
          done

          echo "container app revision did not become ready in time: $target_revision" >&2
          exit 1

      - name: Login to ACR
        if: ${{ github.event_name == 'push' }}
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Update prod-latest tag
        if: ${{ github.event_name == 'push' }}
        run: |
          docker pull "${{ needs.build.outputs.image }}"
          docker tag "${{ needs.build.outputs.image }}" "${{ needs.build.outputs.login_server }}/ldap-service:prod-latest"
          docker push "${{ needs.build.outputs.login_server }}/ldap-service:prod-latest"